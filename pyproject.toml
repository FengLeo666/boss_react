[project]
name = "boss-react"
version = "0.1.0"
description = "Nodriver-backed BOSS browser tools exposed through LangChain middleware"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.4.2,<2",
    "langchain-openai>=1.1,<2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "nodriver>=0.48.1",
    "prompt-toolkit>=3.0,<4",
    "python-dotenv>=1.1,<2",
    "rich>=14,<15",
]

[project.scripts]
boss-react = "boss_react.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss_react"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
